<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MOSQAWAY</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(145deg,#edf7f0,#d9ebe0);color:#18382b;min-height:100vh;padding:22px 16px}.app{max-width:430px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 20px}.logo{font-weight:900;font-size:27px;letter-spacing:1.5px}.badge{background:#fff;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 4px 14px #00000010}.card{background:rgba(255,255,255,.92);border-radius:25px;padding:22px;margin-bottom:16px;box-shadow:0 12px 30px rgba(25,65,45,.09)}.hero{text-align:center}.device{width:140px;height:160px;margin:4px auto 18px;border:3px solid #9bb8a7;border-radius:25px 25px 34px 34px;background:linear-gradient(90deg,#d5e6dc,#fff,#d5e6dc);position:relative}.device:before{content:"";position:absolute;width:60px;height:19px;left:37px;top:-18px;border-radius:8px 8px 3px 3px;background:#294d3d}.device:after{content:"MOSQAWAY";position:absolute;left:0;right:0;top:69px;font-size:12px;font-weight:900;letter-spacing:1px;color:#315b48}.status{font-size:19px;font-weight:800}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9aa79f;margin-right:7px}.on .dot{background:#39a66a}.sub{font-size:13px;color:#71857b;margin-top:6px}.buttons{display:flex;gap:10px;margin-top:18px}.buttons button,.start,.preset{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.onbtn{background:#214e3a;color:white;flex:1}.offbtn{background:#e7eee9;color:#315447;flex:1}.timerhead{display:flex;justify-content:space-between;font-weight:800}.timer{font-size:38px;font-weight:900;text-align:center;margin:18px 0}input{width:100%;accent-color:#214e3a}.presets{display:flex;gap:8px;margin-top:14px}.preset{flex:1;padding:10px;background:#edf4ef;color:#315b48;font-size:13px}.start{width:100%;margin-top:14px;background:#214e3a;color:white}.info{font-size:13px;line-height:1.6;color:#64776e}.footer{text-align:center;font-size:11px;color:#71847b;margin:18px 0 4px}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">MOSQAWAY</div><div class="badge">IoT DIFFUSER</div></div>
<div class="card hero" id="card">
<div class="device"></div>
<div class="status"><span class="dot"></span><span id="power">OFF</span></div>
<div class="sub" id="message">Diffuser sedia untuk digunakan</div>
<div class="buttons"><button class="onbtn" onclick="power(true)">ON</button><button class="offbtn" onclick="power(false)">OFF</button></div>
</div>
<div class="card">
<div class="timerhead"><span>⏱ TIMER</span><span id="label">30 min</span></div>
<div class="timer" id="display">30:00</div>
<input id="range" type="range" min="5" max="120" step="5" value="30" oninput="changeTime(this.value)">
<div class="presets"><button class="preset" onclick="preset(15)">15 min</button><button class="preset" onclick="preset(30)">30 min</button><button class="preset" onclick="preset(60)">60 min</button></div>
<button class="start" onclick="start()">MULA TIMER</button>
</div>
<div class="card"><b>🌿 MOSQAWAY Repellent Mode</b><p class="info">Kawal paparan diffuser dan tetapkan tempoh operasi melalui telefon. Sambungan IoT/hardware boleh ditambah kemudian pada fungsi ON, OFF dan timer.</p></div>
<div class="footer">BAU WANGI, NYAMUK LARI</div>
</div>
<script>
let sec=1800,interval=null;
function power(on){document.getElementById('power').textContent=on?'ON':'OFF';document.getElementById('message').textContent=on?'Diffuser sedang beroperasi':'Diffuser dimatikan';document.getElementById('card').classList.toggle('on',on)}
function render(){let m=Math.floor(sec/60),s=sec%60;document.getElementById('display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function changeTime(v){sec=v*60;document.getElementById('label').textContent=v+' min';render()}
function preset(v){document.getElementById('range').value=v;changeTime(v)}
function start(){clearInterval(interval);power(true);interval=setInterval(()=>{if(sec<=0){clearInterval(interval);power(false);return}sec--;render()},1000)}
render();
</script>
</body>
</html>
